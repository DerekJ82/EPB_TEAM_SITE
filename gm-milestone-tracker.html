<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Base Race - Digital EV Edition</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #050608;
    color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 
    1. THE WINDSHIELD
  */
  .windshield {
    flex: 1;
    position: relative;
    background: linear-gradient(to bottom, #4ba3e3 0%, #b5e1ff 50%, #7bb558 50%, #7bb558 100%);
    overflow: hidden;
    border-bottom: 2px solid #000;
  }

  .hud {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    color: #cc0000;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    transition: color 0.5s;
  }

  .hud.upgraded {
    color: #00ff66;
    text-shadow: 0 0 10px rgba(0,255,102,0.8);
    animation: hudPulse 1s infinite alternate;
  }

  @keyframes hudPulse {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  .windshield::before {
    content: '';
    position: absolute;
    top: 10%;
    right: 15%;
    width: 90px;
    height: 90px;
    background: #fff9d6;
    border-radius: 50%;
    box-shadow: 0 0 60px 30px rgba(255, 249, 214, 0.6);
  }

  #windshield-dirt {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 45; 
    pointer-events: none;
    transition: opacity 0.3s ease-out;
  }

  .smudge {
    position: absolute;
    background: rgba(90, 70, 45, 0.3);
    filter: blur(8px);
    border-radius: 50%;
  }

  .mountains {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 250px;
    transform: translateY(-100%);
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 250" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,250 L80,120 L200,250 L450,30 L650,250 L850,110 L1000,250 Z" fill="%23558c3f"/></svg>') repeat-x bottom;
    background-size: 800px 250px;
    z-index: 1;
  }

  /* 
    2. THE 3D WORLD MAP
  */
  .world-camera {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    perspective: 600px;
    z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 49%, black 52%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, transparent 49%, black 52%, black 100%);
  }

  .world-floor {
    position: absolute;
    bottom: -150px;
    left: -150%; 
    width: 400%; 
    height: 250vh; 
    background: #7bb558; 
    transform: rotateX(80deg);
    transform-origin: bottom center;
    transform-style: preserve-3d;
  }

  .track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 12000px; 
    transform: translateY(0); 
    will-change: transform;
    transform-style: preserve-3d; 
  }

  .road {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 100%;
    background: #333;
    border-left: 12px solid #fff;
    border-right: 12px solid #fff;
  }

  .road-lines {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 100%;
    background: repeating-linear-gradient(to top, #fbcc04 0, #fbcc04 120px, transparent 120px, transparent 240px);
  }

  .object-3d {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) rotateX(-80deg); 
    transform-origin: bottom center;
    text-align: center;
    backface-visibility: hidden;
  }

  .sign {
    background: #007733;
    color: white;
    border: 8px solid #fff;
    border-radius: 12px;
    padding: 25px 40px; 
    box-shadow: 0 40px 80px rgba(0,0,0,0.8);
  }

  .sign::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    background: #666;
    border-left: 2px solid #999;
  }

  .sign h4 { font-size: 48px; margin-bottom: 10px; letter-spacing: 3px; }
  .sign p { font-size: 32px; font-weight: bold; color: #fbcc04; }

  #sign-2024 { bottom: 1500px; margin-left: -320px; }
  #sign-2025 { bottom: 4000px; margin-left: 320px; }
  
  #party-500k {
    bottom: 6500px;
    font-size: 80px;
    width: 600px;
    text-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }
  
  .party-banner {
    background: #cc0000;
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    padding: 16px;
    border: 6px solid #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #sign-1m { bottom: 10000px; margin-left: 0; background: #111; border-color: #00ff66; }
  #sign-1m p { color: #00ff66; }

  /* 
    3. DUAL WINDSHIELD WIPERS & HONK
  */
  .wiper-arm {
    position: absolute;
    bottom: -30px;
    width: 14px;
    height: 55vh;
    background: #111;
    transform-origin: bottom center;
    transform: rotate(-85deg);
    border-radius: 8px;
    z-index: 50;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
  }

  .wiper-arm::before {
    content: '';
    position: absolute;
    top: 5%;
    left: -10px;
    width: 34px;
    height: 90%;
    background: #2a2a2a;
    border-radius: 4px;
    border-right: 3px solid #555;
  }

  .wiper-arm.left { left: 25%; }
  .wiper-arm.right { left: 65%; }

  .wiper-arm.is-wiping { animation: wipeAction 1.2s ease-in-out; }

  @keyframes wipeAction {
    0% { transform: rotate(-85deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(-85deg); }
  }

  #honkGraphic {
    position: absolute;
    top: 40%;
    left: 50%;
    font-size: 110px;
    font-weight: 900;
    font-style: italic;
    color: #fbcc04;
    text-transform: uppercase;
    text-shadow: 4px 4px 0 #cc0000, -4px -4px 0 #cc0000, 4px -4px 0 #cc0000, -4px 4px 0 #cc0000, 0 10px 20px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
    transform: translate(-50%, -50%) scale(0) rotate(-15deg);
    transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #honkGraphic.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-5deg);
  }

  /* 
    4. DIGITAL DASHBOARD (Glass Cockpit Theme)
  */
  .dashboard {
    height: 48vh;
    min-height: 420px;
    background: radial-gradient(circle at top, #141720 0%, #050608 80%);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    padding: 0 4vw;
    border-top: 2px solid #1f232b;
    box-shadow: inset 0 20px 40px rgba(0,0,0,0.8);
    z-index: 100;
  }

  /* 
    DIGITAL GAUGES
  */
  .gauge-container {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gauge-svg {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transform: rotate(135deg);
  }

  .gauge-outer-ticks {
    fill: none;
    stroke: #1f2329;
    stroke-width: 2;
    stroke-dasharray: 2 10.5; /* Creates tick marks */
  }

  .gauge-track {
    fill: none;
    stroke: #16191e;
    stroke-width: 12;
    stroke-linecap: round;
  }

  .gauge-fill {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 216; /* Circumference of r=46 is ~289. 216 is ~75% */
    stroke-dashoffset: 216;
    transition: stroke-dashoffset 2s ease-in-out;
  }

  /* Custom Glows */
  #fill-gm { stroke: #00d2ff; filter: drop-shadow(0 0 8px rgba(0,210,255,0.6)); }
  #fill-kddi { stroke: #39ff14; filter: drop-shadow(0 0 8px rgba(57,255,20,0.6)); }

  /* Text inside gauges */
  .gauge-center-content {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }

  .gauge-value {
    font-size: 54px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    color: #fff;
    line-height: 1;
  }

  .gauge-label {
    font-size: 14px;
    color: #7a8b9a;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  .gauge-subtext {
    font-size: 12px;
    color: #4a5462;
    margin-top: 5px;
  }

  /* 
    CENTER INFO PANEL
  */
  .center-panel {
    width: 400px;
    height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  /* Top Icon Bar */
  .top-icons {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #1a1d24;
    color: #7a8b9a;
    font-size: 14px;
  }

  /* Middle Stats */
  .center-stats {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 15px;
    padding: 0 20px;
    z-index: 10;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .stat-row span {
    font-size: 11px;
    color: #7a8b9a;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .stat-row strong {
    font-size: 20px;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .center-divider {
    height: 1px;
    background: #1a1d24;
    border: none;
    margin: 5px 0;
  }

  /* Background Map/Radar Graphic */
  .map-graphic {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    height: 150px;
    background: 
      linear-gradient(90deg, rgba(31,35,41,0.5) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(0deg, rgba(31,35,41,0.5) 1px, transparent 1px) 0 0 / 20px 20px;
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 70%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 70%);
    opacity: 0.5;
    z-index: 1;
  }

  /* Map Player / Car Icon */
  .map-graphic::after {
    content: '';
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 16px solid #cc0000;
    filter: drop-shadow(0 0 5px rgba(204,0,0,0.8));
  }

  /* Bottom Bar */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
    border-top: 1px solid #1a1d24;
  }

  .bottom-bar span {
    font-size: 12px;
    color: #7a8b9a;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .gear-display {
    font-size: 28px !important;
    color: #fff !important;
  }
  .gear-display.active {
    color: #00ff66 !important;
    text-shadow: 0 0 8px rgba(0,255,102,0.6);
  }

  /* 
    CONTROLS (Sleek side buttons)
  */
  .dash-controls {
    position: absolute;
    bottom: 20px;
    display: flex;
    gap: 20px;
  }
  .dash-controls.left { left: 4vw; }
  .dash-controls.right { right: 4vw; }

  .touch-btn {
    background: #0f1116;
    border: 1px solid #1f2329;
    color: #7a8b9a;
    padding: 12px 24px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
  }
  .touch-btn:hover { color: #fff; background: #16191e; }
  .touch-btn:active { transform: scale(0.95); }

  .btn-primary {
    border-color: #00ff66;
    color: #00ff66;
  }
  .btn-primary.off {
    border-color: #cc0000;
    color: #cc0000;
  }

</style>
</head>
<body>

  <!-- WINDSHIELD SCENE -->
  <div class="windshield">
    <div class="hud" id="hud-target">TARGET: 500,000</div>
    <div id="honkGraphic">HONK!!!</div>
    
    <div id="windshield-dirt">
      <div class="smudge" style="top: 15%; left: 20%; width: 220px; height: 140px; transform: rotate(15deg);"></div>
      <div class="smudge" style="top: 35%; left: 55%; width: 250px; height: 120px; transform: rotate(-10deg);"></div>
      <div class="smudge" style="top: 10%; left: 75%; width: 190px; height: 150px; transform: rotate(45deg);"></div>
      <div class="smudge" style="top: 50%; left: 10%; width: 180px; height: 100px; transform: rotate(-25deg);"></div>
      <div class="smudge" style="top: 40%; left: 80%; width: 200px; height: 110px; transform: rotate(5deg);"></div>
    </div>

    <div class="mountains"></div>

    <div class="world-camera">
      <div class="world-floor">
        <div class="track" id="master-track">
          <div class="road">
            <div class="road-lines"></div>
          </div>
          
          <div class="object-3d sign" id="sign-2024">
            <h4>2024</h4>
            <p>25,000</p>
          </div>
          
          <div class="object-3d sign" id="sign-2025">
            <h4>2025</h4>
            <p>210,000</p>
          </div>
          
          <div class="object-3d" id="party-500k">
            <div>🎊🎉🎈🚗💨</div>
            <div class="party-banner">500K CRUSHED - JULY 2026</div>
          </div>

          <div class="object-3d sign" id="sign-1m">
            <h4>TARGET</h4>
            <p style="color: #00ff66;">1,000,000</p>
          </div>
        </div>
      </div>
    </div>

    <div class="wiper-arm left" id="wiperLeft"></div>
    <div class="wiper-arm right" id="wiperRight"></div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="dashboard">
    
    <!-- LEFT CONTROLS -->
    <div class="dash-controls left">
      <button class="touch-btn" onclick="triggerWipe()">WIPE</button>
      <button class="touch-btn" onclick="honkHorn()">HORN</button>
    </div>

    <!-- GM GAUGE (LEFT) -->
    <div class="gauge-container">
      <svg class="gauge-svg" viewBox="0 0 120 120">
        <!-- R=56, Circumference=351. Outer ring. -->
        <circle class="gauge-outer-ticks" cx="60" cy="60" r="56" stroke-dasharray="212 351" stroke-dashoffset="0"></circle>
        <!-- R=46, Circumference=289. Inner track. 216 is ~75% of 289 -->
        <circle class="gauge-track" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-gm" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="216"></circle>
      </svg>
      <div class="gauge-center-content">
        <div class="gauge-label">GM</div>
        <div class="gauge-value" id="val-gm">0</div>
        <div class="gauge-subtext" id="pct-gm" style="color: #00d2ff;">0.00%</div>
      </div>
    </div>

    <!-- CENTER INFO PANEL -->
    <div class="center-panel">
      <div class="top-icons">
        <span>📍</span>
        <span>⏱</span>
        <span>/!\</span>
        <span>🔋</span>
      </div>
      
      <div class="map-graphic"></div>

      <div class="center-stats">
        <div class="stat-row">
          <span>TOTAL VOLUME</span>
          <strong id="val-total">0</strong>
        </div>
        <div class="stat-row">
          <span>OVERALL TARGET</span>
          <strong style="color:#00ff66">1,000,000</strong>
        </div>
        <hr class="center-divider">
        <div class="stat-row">
          <span>CHERRY FLEET</span>
          <strong style="color:#b026ff">LOADING (0)</strong>
        </div>
      </div>

      <div class="bottom-bar">
        <span>AUG 11 2026</span>
        <span class="gear-display" id="gear-indicator">P</span>
        <span>1:44 PM</span>
      </div>
    </div>

    <!-- KDDI GAUGE (RIGHT) -->
    <div class="gauge-container">
      <svg class="gauge-svg" viewBox="0 0 120 120">
        <circle class="gauge-outer-ticks" cx="60" cy="60" r="56" stroke-dasharray="212 351" stroke-dashoffset="0"></circle>
        <circle class="gauge-track" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-kddi" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="216"></circle>
      </svg>
      <div class="gauge-center-content">
        <div class="gauge-label">KDDI</div>
        <div class="gauge-value" id="val-kddi">0</div>
        <div class="gauge-subtext" id="pct-kddi" style="color: #39ff14;">0.00%</div>
      </div>
    </div>

    <!-- RIGHT CONTROLS -->
    <div class="dash-controls right">
      <button class="touch-btn btn-primary off" id="ignitionBtn" onclick="toggleIgnition()">START ENGINE</button>
    </div>

  </div>

  <script>
    const TARGET_1M = 1000000;
    // For r=46, circumference is ~289. We want 216 for a 270 degree arc.
    const ARC_LENGTH = 216; 

    let reqFrames = {};
    let currentVals = { gm: 0, kddi: 0, total: 0 };
    let driveSequenceActive = false;
    let trackY = 0; 
    let engineRunning = false;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function animateValue(id, start, end, duration) {
      if (reqFrames[id]) cancelAnimationFrame(reqFrames[id]);
      const obj = document.getElementById(`val-${id}`);
      let startTimestamp = null;
      
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeOut = 0.5 - Math.cos(progress * Math.PI) / 2; 
        const current = Math.floor(easeOut * (end - start) + start);
        
        obj.innerHTML = current.toLocaleString();
        
        if (progress < 1) {
          reqFrames[id] = window.requestAnimationFrame(step);
        }
      };
      reqFrames[id] = window.requestAnimationFrame(step);
    }

    function updateGauges(gmVal, kddiVal, durationMs) {
      const targets = [
        { id: 'gm', val: gmVal },
        { id: 'kddi', val: kddiVal }
      ];

      // Calculate Total
      const totalVal = gmVal + kddiVal;
      
      targets.forEach(item => {
        const pct = (item.val / TARGET_1M) * 100; 
        const fill = document.getElementById(`fill-${item.id}`);
        const pctEl = document.getElementById(`pct-${item.id}`);

        fill.style.transition = `stroke-dashoffset ${durationMs}ms ease-in-out`;
        
        // Prevent going to absolute zero visually so glow remains
        const displayPct = Math.max(pct, 0.5); 
        const fillAmount = (displayPct / 100) * ARC_LENGTH; 
        fill.style.strokeDashoffset = ARC_LENGTH - fillAmount;

        pctEl.innerHTML = pct.toFixed(2) + "% of 1M";

        if (durationMs > 0) {
            animateValue(item.id, currentVals[item.id], item.val, durationMs);
        } else {
            document.getElementById(`val-${item.id}`).innerHTML = item.val.toLocaleString();
        }
        currentVals[item.id] = item.val;
      });

      // Update Center Total
      if (durationMs > 0) {
          animateValue('total', currentVals.total, totalVal, durationMs);
      } else {
          document.getElementById('val-total').innerHTML = totalVal.toLocaleString();
      }
      currentVals.total = totalVal;
    }

    async function driveTo(distanceY, duration) {
      if (!driveSequenceActive) return;
      const track = document.getElementById('master-track');
      
      const anim = track.animate([
        { transform: `translateY(${trackY}px)` },
        { transform: `translateY(${distanceY}px)` }
      ], { 
        duration: duration, 
        easing: 'ease-in-out', 
        fill: 'forwards' 
      });

      trackY = distanceY;
      await anim.finished; 
    }

    function toggleIgnition() {
      const btn = document.getElementById('ignitionBtn');
      const gear = document.getElementById('gear-indicator');
      
      if (!engineRunning) {
        engineRunning = true;
        btn.classList.replace('off', 'on');
        btn.innerHTML = 'STOP ENGINE';
        gear.innerHTML = 'D';
        gear.classList.add('active');
        startDriveSequence();
      } else {
        engineRunning = false;
        driveSequenceActive = false;
        btn.classList.replace('on', 'off');
        btn.innerHTML = 'START ENGINE';
        gear.innerHTML = 'P';
        gear.classList.remove('active');
        
        document.getElementById('master-track').style.transform = `translateY(0)`;
        updateGauges(0, 0, 500);
        const hud = document.getElementById('hud-target');
        hud.className = 'hud';
        hud.innerHTML = 'TARGET: 500,000';
        
        document.getElementById('windshield-dirt').style.opacity = '1';
      }
    }

    async function startDriveSequence() {
      driveSequenceActive = false; 
      await sleep(50);
      driveSequenceActive = true;
      trackY = 0;

      const hud = document.getElementById('hud-target');
      hud.className = 'hud';
      hud.innerHTML = 'TARGET: 500,000';

      document.getElementById('master-track').style.transform = `translateY(0)`;
      updateGauges(0, 0, 0);
      
      await sleep(1000);
      if (!driveSequenceActive) return;

      // LEG 1: 2024
      await driveTo(1200, 3000); 
      if (!driveSequenceActive) return;
      updateGauges(25000, 0, 2000);
      await sleep(2500); 

      // LEG 2: 2025
      await driveTo(3700, 3500); 
      if (!driveSequenceActive) return;
      updateGauges(198000, 12000, 2000);
      await sleep(2500);

      // LEG 3: 500k Party
      await driveTo(6200, 3500); 
      if (!driveSequenceActive) return;
      updateGauges(523028, 41055, 2000);
      
      fireConfetti();
      await sleep(800);
      fireConfetti();
      
      hud.classList.add('upgraded');
      hud.innerHTML = 'TARGET UPGRADED: 1,000,000!';
      await sleep(3500); 

      // LEG 4: Toward 1 Million
      await driveTo(9700, 4000); 
    }

    function fireConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.4 },
        colors: ['#4ba3e3', '#00ff66', '#fbcc04', '#cc0000', '#ffffff']
      });
    }

    function triggerWipe() {
      const leftWiper = document.getElementById('wiperLeft');
      const rightWiper = document.getElementById('wiperRight');
      
      leftWiper.classList.remove('is-wiping');
      rightWiper.classList.remove('is-wiping');
      void leftWiper.offsetWidth; 
      
      leftWiper.classList.add('is-wiping');
      rightWiper.classList.add('is-wiping');
      
      setTimeout(() => {
        document.getElementById('windshield-dirt').style.opacity = '0';
      }, 600);
    }

    function honkHorn() {
      const honk = document.getElementById('honkGraphic');
      honk.classList.add('show');
      
      const windshield = document.querySelector('.windshield');
      windshield.style.filter = 'brightness(1.15)';
      
      setTimeout(() => {
        honk.classList.remove('show');
        windshield.style.filter = 'none';
      }, 350);
    }

    window.onload = () => {
      updateGauges(0, 0, 0);
    };
  </script>
</body>
</html>
