<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Base Race - 1 Million Edition</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #eef2f5;
    color: #333;
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 
    1. THE WINDSHIELD
  */
  .windshield {
    flex: 1;
    position: relative;
    background: linear-gradient(to bottom, #4ba3e3 0%, #b5e1ff 50%, #7bb558 50%, #7bb558 100%);
    overflow: hidden;
    border-bottom: 8px solid #333;
  }

  .hud {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    color: #cc0000;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    transition: color 0.5s;
  }

  .hud.upgraded {
    color: #00ff66;
    text-shadow: 0 0 10px rgba(0,255,102,0.8);
    animation: hudPulse 1s infinite alternate;
  }

  @keyframes hudPulse {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  /* The Sun */
  .windshield::before {
    content: '';
    position: absolute;
    top: 10%;
    right: 15%;
    width: 90px;
    height: 90px;
    background: #fff9d6;
    border-radius: 50%;
    box-shadow: 0 0 60px 30px rgba(255, 249, 214, 0.6);
  }

  /* Dirty Windshield Layer */
  #windshield-dirt {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 45; /* Sits directly beneath the wiper blade */
    pointer-events: none;
    transition: opacity 0.3s ease-out;
  }

  .smudge {
    position: absolute;
    background: rgba(90, 70, 45, 0.4);
    filter: blur(6px);
    border-radius: 50%;
  }

  /* Horizon Mountains */
  .mountains {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 250px;
    transform: translateY(-100%);
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 250" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,250 L80,120 L200,250 L450,30 L650,250 L850,110 L1000,250 Z" fill="%23558c3f"/></svg>') repeat-x bottom;
    background-size: 800px 250px;
    z-index: 1;
  }

  /* 
    2. THE 3D WORLD MAP
  */
  .world-camera {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    perspective: 600px;
    z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 49%, black 52%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, transparent 49%, black 52%, black 100%);
  }

  .world-floor {
    position: absolute;
    bottom: -150px;
    left: -150%; 
    width: 400%; 
    height: 250vh; 
    background: #7bb558; 
    transform: rotateX(80deg);
    transform-origin: bottom center;
    transform-style: preserve-3d;
  }

  .track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 12000px; 
    transform: translateY(0); 
    will-change: transform;
    transform-style: preserve-3d; 
  }

  .road {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 100%;
    background: #333;
    border-left: 12px solid #fff;
    border-right: 12px solid #fff;
  }

  .road-lines {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 100%;
    background: repeating-linear-gradient(
      to top, 
      #fbcc04 0,
      #fbcc04 120px,
      transparent 120px,
      transparent 240px
    );
  }

  .object-3d {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) rotateX(-80deg); 
    transform-origin: bottom center;
    text-align: center;
    backface-visibility: hidden;
  }

  /* MASSIVE ROAD SIGNS */
  .sign {
    background: #007733;
    color: white;
    border: 8px solid #fff;
    border-radius: 12px;
    padding: 25px 40px; 
    box-shadow: 0 40px 80px rgba(0,0,0,0.8);
  }

  .sign::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    background: #666;
    border-left: 2px solid #999;
  }

  .sign h4 { font-size: 48px; margin-bottom: 10px; letter-spacing: 3px; }
  .sign p { font-size: 32px; font-weight: bold; color: #fbcc04; }

  /* Map Locations */
  #sign-2024 { bottom: 1500px; margin-left: -320px; }
  #sign-2025 { bottom: 4000px; margin-left: 320px; }
  
  #party-500k {
    bottom: 6500px;
    font-size: 80px;
    width: 600px;
    text-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }
  
  .party-banner {
    background: #cc0000;
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    padding: 16px;
    border: 6px solid #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #sign-1m { bottom: 10000px; margin-left: 0; background: #111; border-color: #00ff66; }
  #sign-1m p { color: #00ff66; }

  /* The Pop-Up HONK Graphic */
  #honkGraphic {
    position: absolute;
    top: 40%;
    left: 50%;
    font-size: 110px;
    font-weight: 900;
    font-style: italic;
    color: #fbcc04;
    text-transform: uppercase;
    text-shadow: 
      4px 4px 0 #cc0000, -4px -4px 0 #cc0000,
      4px -4px 0 #cc0000, -4px 4px 0 #cc0000,
      0 10px 20px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
    transform: translate(-50%, -50%) scale(0) rotate(-15deg);
    transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #honkGraphic.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-5deg);
  }

  /* 
    3. THE DASHBOARD CONSOLE (Lighter, Premium Brushed Aluminum)
  */
  .dashboard {
    height: 45vh;
    min-height: 380px;
    background: linear-gradient(to bottom, #f0f2f5 0%, #dce1e6 100%);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4vw;
    padding: 20px;
    border-top: 4px solid #b0b8c0;
    box-shadow: inset 0 8px 15px rgba(255,255,255,1), 0 -15px 40px rgba(0,0,0,0.2);
    z-index: 100;
  }

  /* AC Vents */
  .ac-vent {
    position: absolute;
    top: 30px;
    width: 60px;
    height: 120px;
    background: #111;
    border: 3px solid #888;
    border-radius: 8px;
    box-shadow: inset 0 0 10px #000, 0 5px 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 10px 5px;
  }
  .ac-vent.left { left: 40px; }
  .ac-vent.right { right: 40px; }
  .vent-slat { width: 100%; height: 6px; background: #222; border-bottom: 1px solid #444; }

  /* Digital Display Cluster */
  .digital-dash {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    border: 2px solid #666;
    border-radius: 6px;
    padding: 8px 20px;
    display: flex;
    gap: 30px;
    color: #00bfff;
    font-family: monospace;
    font-size: 16px;
    letter-spacing: 2px;
    box-shadow: inset 0 0 15px rgba(0,191,255,0.2), 0 5px 10px rgba(0,0,0,0.1);
  }
  .digital-dash span { display: flex; flex-direction: column; align-items: center; }
  .digital-dash small { font-size: 10px; color: #888; margin-bottom: 2px; }
  .gear { color: #fff; font-weight: bold; }
  .gear.active { color: #00ff66; text-shadow: 0 0 5px #00ff66; }

  /* 
    4. LARGER, MODERN GAUGES 
  */
  .gauge-container {
    position: relative;
    width: 270px; 
    height: 270px;
    background: radial-gradient(circle, #1a1a1a, #050505);
    border-radius: 50%;
    border: 6px solid #2b2e33;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 15px 35px rgba(0,0,0,0.3), 0 0 0 2px #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gauge-center { transform: translateY(-50px); }

  /* Increased Font Sizes */
  .gauge-label {
    position: absolute;
    top: 40px;
    font-size: 20px;
    font-weight: 800;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 4px;
  }

  .gauge-value {
    position: absolute;
    bottom: 55px;
    font-size: 34px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 10px rgba(255,255,255,0.2);
  }

  .gauge-pct {
    position: absolute;
    bottom: 30px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1.5px;
  }

  svg.gauge-svg {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transform: rotate(135deg);
  }

  .gauge-ticks {
    fill: none;
    stroke: #444;
    stroke-width: 4;
    stroke-dasharray: 2 12;
  }

  .gauge-track {
    fill: none;
    stroke: #222;
    stroke-width: 4;
  }

  .gauge-fill {
    fill: none;
    stroke-width: 6;
    stroke-dasharray: 283; 
    stroke-dashoffset: 283;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px currentColor);
  }

  .needle-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-135deg);
  }

  .needle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 46%;
    background: #fff;
    transform-origin: bottom center;
    transform: translate(-50%, -100%);
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
  }

  .needle::before {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 10px solid currentColor;
  }

  .needle-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 34px;
    height: 34px;
    background: radial-gradient(circle, #333, #0a0a0a);
    border: 2px solid #555;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 5px 10px rgba(0,0,0,0.6);
  }
  
  .needle-center::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    background: currentColor;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 5px currentColor;
  }

  /* 
    5. STEERING WHEEL, WIPER, AND IGNITION
  */
  .steering-column {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* The Wiper Blade */
  .wiper-arm {
    position: absolute;
    bottom: -20px;
    left: 45%;
    width: 12px;
    height: 45vh;
    background: #1a1a1a;
    transform-origin: bottom center;
    transform: rotate(-80deg);
    border-radius: 6px;
    z-index: 50;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
  }

  .wiper-arm::before {
    content: '';
    position: absolute;
    top: 5%;
    left: -6px;
    width: 24px;
    height: 90%;
    background: #2a2a2a;
    border-radius: 4px;
    border-right: 2px solid #555;
  }

  .wiper-arm.is-wiping {
    animation: wipeAction 1.2s ease-in-out;
  }

  @keyframes wipeAction {
    0% { transform: rotate(-80deg); }
    50% { transform: rotate(80deg); }
    100% { transform: rotate(-80deg); }
  }

  .wiper-stalk {
    position: absolute;
    left: -220px; 
    top: 100px; 
    width: 120px;
    height: 28px;
    background: linear-gradient(to bottom, #333, #111);
    border: 2px solid #000;
    border-radius: 14px 0 0 14px;
    color: #aaa;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    text-align: left;
    padding-left: 15px;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    transform-origin: right center;
    transition: transform 0.1s, color 0.2s;
    z-index: 9;
  }

  .wiper-stalk:hover { color: #fff; }
  .wiper-stalk:active { transform: rotate(-5deg); }

  /* IGNITION BUTTON */
  .ignition-btn {
    position: absolute;
    right: -210px;
    top: 70px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, #222, #0a0a0a);
    border: 4px solid #555;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 9;
  }

  .ignition-btn.off {
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,0,0,0.3);
    border-color: #aa2222;
  }
  
  .ignition-btn.on {
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,255,102,0.4);
    border-color: #00ff66;
  }

  .ignition-btn:active { transform: scale(0.92); }

  .ignition-btn span {
    font-size: 10px;
    font-weight: bold;
    color: #fff;
    text-align: center;
    line-height: 1.2;
  }
  
  .ignition-btn .status-light {
    width: 12px; height: 4px;
    background: #ff3333;
    border-radius: 2px;
    margin-top: 6px;
    box-shadow: 0 0 5px #ff3333;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .ignition-btn.on .status-light {
    background: #00ff66;
    box-shadow: 0 0 8px #00ff66;
  }

  /* Horn / Wheel */
  .horn-wrapper {
    position: relative;
    width: 480px;
    height: 240px;
    background: #111;
    border-radius: 240px 240px 0 0;
    border: 20px solid #050505;
    border-bottom: none;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 35px;
    box-shadow: 0 -15px 50px rgba(0,0,0,0.6);
    z-index: 10;
  }

  .horn-btn {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #333, #111);
    border: 2px solid #000;
    color: #fff;
    cursor: pointer;
    box-shadow: inset 0 -5px 15px rgba(0,0,0,0.5), 0 15px 30px rgba(0,0,0,0.5);
    transition: all 0.1s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .horn-btn:active {
    transform: scale(0.96) translateY(5px);
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5);
  }

  .horn-btn span {
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 3px;
    color: #ddd;
    text-shadow: 0 2px 4px #000;
  }

</style>
</head>
<body>

  <div class="windshield">
    <div class="hud" id="hud-target">TARGET: 500,000</div>
    <div id="honkGraphic">HONK!!!</div>
    
    <!-- Functional Dirt Layer -->
    <div id="windshield-dirt">
      <div class="smudge" style="top: 25%; left: 35%; width: 120px; height: 80px; transform: rotate(15deg);"></div>
      <div class="smudge" style="top: 45%; left: 65%; width: 150px; height: 60px; transform: rotate(-10deg);"></div>
      <div class="smudge" style="top: 30%; left: 80%; width: 90px; height: 50px; transform: rotate(45deg);"></div>
    </div>

    <div class="mountains"></div>

    <div class="world-camera">
      <div class="world-floor">
        <div class="track" id="master-track">
          <div class="road">
            <div class="road-lines"></div>
          </div>
          
          <!-- Bigger 3D Objects -->
          <div class="object-3d sign" id="sign-2024">
            <h4>2024</h4>
            <p>25,000</p>
          </div>
          
          <div class="object-3d sign" id="sign-2025">
            <h4>2025</h4>
            <p>210,000</p>
          </div>
          
          <div class="object-3d" id="party-500k">
            <div>🎊🎉🎈🚗💨</div>
            <div class="party-banner">500K CRUSHED - JULY 2026</div>
          </div>

          <div class="object-3d sign" id="sign-1m">
            <h4>TARGET</h4>
            <p style="color: #00ff66;">1,000,000</p>
          </div>
        </div>
      </div>
    </div>

    <div class="wiper-arm" id="wiperArm"></div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="dashboard">
    
    <!-- AC VENTS -->
    <div class="ac-vent left">
      <div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div>
    </div>
    <div class="ac-vent right">
      <div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div>
    </div>

    <!-- DIGITAL DASH DISPLAY -->
    <div class="digital-dash">
      <span><small>TEMP</small>22°C</span>
      <span><small>GEAR</small><span class="gear" id="gear-indicator">P</span></span>
      <span><small>DATE</small>AUG 11 2026</span>
    </div>
    
    <!-- GM GAUGE (EV Blue) -->
    <div class="gauge-container">
      <div class="gauge-label">GM</div>
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-ticks" cx="50" cy="50" r="45"></circle>
        <circle class="gauge-track" cx="50" cy="50" r="45" stroke-dasharray="212" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-gm" cx="50" cy="50" r="45" style="stroke: #00bfff; color: #00bfff;"></circle>
      </svg>
      <div class="needle-container" id="needle-gm">
        <div class="needle" style="color: #00bfff;"></div>
      </div>
      <div class="needle-center" style="color: #00bfff;"></div>
      <div class="gauge-value" id="val-gm">0</div>
      <div class="gauge-pct" style="color: #00bfff;" id="pct-gm">0.00%</div>
    </div>

    <!-- KDDI GAUGE (Neon Green) -->
    <div class="gauge-container gauge-center">
      <div class="gauge-label">KDDI</div>
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-ticks" cx="50" cy="50" r="45"></circle>
        <circle class="gauge-track" cx="50" cy="50" r="45" stroke-dasharray="212" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-kddi" cx="50" cy="50" r="45" style="stroke: #39ff14; color: #39ff14;"></circle>
      </svg>
      <div class="needle-container" id="needle-kddi">
        <div class="needle" style="color: #39ff14;"></div>
      </div>
      <div class="needle-center" style="color: #39ff14;"></div>
      <div class="gauge-value" id="val-kddi">0</div>
      <div class="gauge-pct" style="color: #39ff14;" id="pct-kddi">0.00%</div>
    </div>

    <!-- CHERRY GAUGE (Neon Purple) -->
    <div class="gauge-container">
      <div class="gauge-label">CHERRY</div>
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-ticks" cx="50" cy="50" r="45"></circle>
        <circle class="gauge-track" cx="50" cy="50" r="45" stroke-dasharray="212" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-cherry" cx="50" cy="50" r="45" style="stroke: #b026ff; color: #b026ff;"></circle>
      </svg>
      <div class="needle-container" id="needle-cherry">
        <div class="needle" style="color: #b026ff;"></div>
      </div>
      <div class="needle-center" style="color: #b026ff;"></div>
      <div class="gauge-value" id="val-cherry">0</div>
      <div class="gauge-pct" style="color: #b026ff;" id="pct-cherry">Loading</div>
    </div>

    <!-- STEERING COLUMN & CONTROLS -->
    <div class="steering-column">
      
      <button class="wiper-stalk" onclick="triggerWipe()">
        Wipe
      </button>

      <!-- NEW IGNITION BUTTON -->
      <div class="ignition-btn off" id="ignitionBtn" onclick="toggleIgnition()">
        <span>ENGINE<br>START<br>STOP</span>
        <div class="status-light"></div>
      </div>

      <div class="horn-wrapper">
        <button class="horn-btn" onclick="honkHorn()">
          <span>GM</span>
        </button>
      </div>

    </div>

  </div>

  <script>
    const TARGET_1M = 1000000;
    const MAX_DASH = 212; 
    const DASH_OFFSET_START = 283; 
    const MAX_DEG = 270;

    let reqFrames = {};
    let currentVals = { gm: 0, kddi: 0, cherry: 0 };
    let driveSequenceActive = false;
    let trackY = 0; 
    let engineRunning = false;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function animateValue(id, start, end, duration) {
      if (reqFrames[id]) cancelAnimationFrame(reqFrames[id]);
      const obj = document.getElementById(`val-${id}`);
      let startTimestamp = null;
      
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeOut = 0.5 - Math.cos(progress * Math.PI) / 2; 
        const current = Math.floor(easeOut * (end - start) + start);
        
        obj.innerHTML = current.toLocaleString();
        
        if (progress < 1) {
          reqFrames[id] = window.requestAnimationFrame(step);
        }
      };
      reqFrames[id] = window.requestAnimationFrame(step);
    }

    function updateGauges(targets, durationMs) {
      Object.keys(targets).forEach(id => {
        const val = targets[id];
        const pct = (val / TARGET_1M) * 100; 
        
        const fill = document.getElementById(`fill-${id}`);
        const needle = document.getElementById(`needle-${id}`);
        const pctEl = document.getElementById(`pct-${id}`);

        fill.style.transition = `stroke-dashoffset ${durationMs}ms ease-in-out`;
        needle.style.transition = `transform ${durationMs}ms ease-in-out`;
        
        const displayPct = Math.max(pct, 0.1); 

        const fillAmount = (displayPct / 100) * MAX_DASH; 
        fill.style.strokeDashoffset = DASH_OFFSET_START - fillAmount;

        const rotDegree = -135 + ((displayPct / 100) * MAX_DEG);
        needle.style.transform = `rotate(${rotDegree}deg)`;

        if (id !== 'cherry') {
            pctEl.innerHTML = pct.toFixed(2) + "% of 1M";
        }

        if (durationMs > 0) {
            animateValue(id, currentVals[id], val, durationMs);
        } else {
            document.getElementById(`val-${id}`).innerHTML = val.toLocaleString();
        }
        currentVals[id] = val;
      });
    }

    async function driveTo(distanceY, duration) {
      if (!driveSequenceActive) return;
      const track = document.getElementById('master-track');
      
      const anim = track.animate([
        { transform: `translateY(${trackY}px)` },
        { transform: `translateY(${distanceY}px)` }
      ], { 
        duration: duration, 
        easing: 'ease-in-out', 
        fill: 'forwards' 
      });

      trackY = distanceY;
      await anim.finished; 
    }

    // IGNITION LOGIC
    function toggleIgnition() {
      const btn = document.getElementById('ignitionBtn');
      const gear = document.getElementById('gear-indicator');
      
      if (!engineRunning) {
        // Start Engine
        engineRunning = true;
        btn.classList.replace('off', 'on');
        gear.innerHTML = 'D';
        gear.classList.add('active');
        startDriveSequence();
      } else {
        // Stop Engine
        engineRunning = false;
        driveSequenceActive = false;
        btn.classList.replace('on', 'off');
        gear.innerHTML = 'P';
        gear.classList.remove('active');
        
        // Reset everything instantly
        document.getElementById('master-track').style.transform = `translateY(0)`;
        updateGauges({ gm: 0, kddi: 0, cherry: 0 }, 500);
        const hud = document.getElementById('hud-target');
        hud.className = 'hud';
        hud.innerHTML = 'TARGET: 500,000';
        
        // Re-dirty the windshield when parked!
        document.getElementById('windshield-dirt').style.opacity = '1';
      }
    }

    async function startDriveSequence() {
      driveSequenceActive = false; 
      await sleep(50);
      driveSequenceActive = true;
      trackY = 0;

      const hud = document.getElementById('hud-target');
      hud.className = 'hud';
      hud.innerHTML = 'TARGET: 500,000';

      document.getElementById('master-track').style.transform = `translateY(0)`;
      updateGauges({ gm: 0, kddi: 0, cherry: 0 }, 0);
      currentVals = { gm: 0, kddi: 0, cherry: 0 };
      
      await sleep(1000);
      if (!driveSequenceActive) return;

      // LEG 1: 2024
      await driveTo(1200, 3000); 
      if (!driveSequenceActive) return;
      updateGauges({ gm: 25000, kddi: 0, cherry: 0 }, 2000);
      await sleep(2500); 

      // LEG 2: 2025
      await driveTo(3700, 3500); 
      if (!driveSequenceActive) return;
      updateGauges({ gm: 198000, kddi: 12000, cherry: 0 }, 2000);
      await sleep(2500);

      // LEG 3: 500k Party
      await driveTo(6200, 3500); 
      if (!driveSequenceActive) return;
      updateGauges({ gm: 523028, kddi: 41055, cherry: 0 }, 2000);
      
      fireConfetti();
      await sleep(800);
      fireConfetti();
      
      hud.classList.add('upgraded');
      hud.innerHTML = 'TARGET UPGRADED: 1,000,000!';
      await sleep(3500); 

      // LEG 4: Toward 1 Million
      await driveTo(9700, 4000); 
    }

    function fireConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.4 },
        colors: ['#4ba3e3', '#00ff66', '#fbcc04', '#cc0000', '#ffffff']
      });
    }

    function triggerWipe() {
      const wiper = document.getElementById('wiperArm');
      wiper.classList.remove('is-wiping');
      void wiper.offsetWidth;
      wiper.classList.add('is-wiping');
      
      // Clean the windshield exactly halfway through the 1.2s animation
      setTimeout(() => {
        document.getElementById('windshield-dirt').style.opacity = '0';
      }, 600);
    }

    function honkHorn() {
      const honk = document.getElementById('honkGraphic');
      honk.classList.add('show');
      
      const windshield = document.querySelector('.windshield');
      windshield.style.filter = 'brightness(1.15)';
      
      setTimeout(() => {
        honk.classList.remove('show');
        windshield.style.filter = 'none';
      }, 350);
    }

    // Initialize layout but wait for ignition button press
    window.onload = () => {
      updateGauges({ gm: 0, kddi: 0, cherry: 0 }, 0);
    };
  </script>
</body>
</html>
