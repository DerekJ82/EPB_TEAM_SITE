<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Base Race - 1 Million Edition (Responsive)</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #050608;
    color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 
    1. THE WINDSHIELD
  */
  .windshield {
    flex: 1;
    position: relative;
    background: linear-gradient(to bottom, #4ba3e3 0%, #b5e1ff 50%, #7bb558 50%, #7bb558 100%);
    overflow: hidden;
    border-bottom: 8px solid #111;
    min-height: 40vh;
  }

  .hud {
    position: absolute;
    top: clamp(10px, 2vh, 20px);
    left: clamp(10px, 2vw, 20px);
    z-index: 20;
    color: #cc0000;
    font-weight: 900;
    font-size: clamp(12px, 1.5vw, 16px);
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    transition: color 0.5s;
  }

  .hud.upgraded {
    color: #00ff66;
    text-shadow: 0 0 10px rgba(0,255,102,0.8);
    animation: hudPulse 1s infinite alternate;
  }

  @keyframes hudPulse {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  .windshield::before {
    content: '';
    position: absolute;
    top: 10%;
    right: 15%;
    width: clamp(50px, 8vw, 90px);
    height: clamp(50px, 8vw, 90px);
    background: #fff9d6;
    border-radius: 50%;
    box-shadow: 0 0 60px 30px rgba(255, 249, 214, 0.6);
  }

  #windshield-dirt {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 45; 
    pointer-events: none;
    transition: opacity 0.3s ease-out;
  }

  .smudge {
    position: absolute;
    background: rgba(90, 70, 45, 0.3);
    filter: blur(8px);
    border-radius: 50%;
  }

  .mountains {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 250px;
    transform: translateY(-100%);
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 250" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,250 L80,120 L200,250 L450,30 L650,250 L850,110 L1000,250 Z" fill="%23558c3f"/></svg>') repeat-x bottom;
    background-size: 800px 250px;
    z-index: 1;
  }

  /* 
    2. THE 3D WORLD MAP
  */
  .world-camera {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    perspective: 600px;
    z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 49%, black 52%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, transparent 49%, black 52%, black 100%);
  }

  .world-floor {
    position: absolute;
    bottom: -150px;
    left: -150%; 
    width: 400%; 
    height: 250vh; 
    background: #7bb558; 
    transform: rotateX(80deg);
    transform-origin: bottom center;
    transform-style: preserve-3d;
  }

  .track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 12000px; 
    transform: translateY(0); 
    will-change: transform;
    transform-style: preserve-3d; 
  }

  .road {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(200px, 30vw, 400px);
    height: 100%;
    background: #333;
    border-left: clamp(4px, 1vw, 12px) solid #fff;
    border-right: clamp(4px, 1vw, 12px) solid #fff;
  }

  .road-lines {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(4px, 1vw, 12px);
    height: 100%;
    background: repeating-linear-gradient(to top, #fbcc04 0, #fbcc04 120px, transparent 120px, transparent 240px);
  }

  .object-3d {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) rotateX(-80deg); 
    transform-origin: bottom center;
    text-align: center;
    backface-visibility: hidden;
  }

  /* FLUID ROAD SIGNS */
  .sign {
    background: #007733;
    color: white;
    border: clamp(4px, 1vw, 8px) solid #fff;
    border-radius: 12px;
    padding: clamp(15px, 2vw, 25px) clamp(20px, 3vw, 40px); 
    box-shadow: 0 40px 80px rgba(0,0,0,0.8);
  }

  .sign::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(10px, 1.5vw, 20px);
    height: 100px;
    background: #666;
    border-left: 2px solid #999;
  }

  .sign h4 { font-size: clamp(24px, 4vw, 48px); margin-bottom: 5px; letter-spacing: 3px; }
  .sign p { font-size: clamp(18px, 3vw, 32px); font-weight: bold; color: #fbcc04; }

  #sign-2024 { bottom: 1500px; margin-left: -25vw; }
  #sign-2025 { bottom: 4000px; margin-left: 25vw; }
  
  #party-500k {
    bottom: 6500px;
    font-size: clamp(40px, 6vw, 80px);
    width: clamp(300px, 50vw, 600px);
    text-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }
  
  .party-banner {
    background: #cc0000;
    color: #fff;
    font-size: clamp(18px, 2.5vw, 32px);
    font-weight: 900;
    padding: clamp(8px, 1vw, 16px);
    border: clamp(3px, 0.5vw, 6px) solid #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #sign-1m { bottom: 10000px; margin-left: 0; background: #111; border-color: #00ff66; width: clamp(250px, 50vw, 700px); }
  #sign-1m p { color: #00ff66; }

  /* 
    3. DUAL WINDSHIELD WIPERS & HONK
  */
  .wiper-arm {
    position: absolute;
    bottom: -30px;
    width: clamp(8px, 1.5vw, 14px);
    height: 55vh;
    background: #111;
    transform-origin: bottom center;
    transform: rotate(-85deg);
    border-radius: 8px;
    z-index: 50;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
  }

  .wiper-arm::before {
    content: '';
    position: absolute;
    top: 5%;
    left: -70%;
    width: 250%;
    height: 90%;
    background: #2a2a2a;
    border-radius: 4px;
    border-right: 3px solid #555;
  }

  .wiper-arm.left { left: 25%; }
  .wiper-arm.right { left: 65%; }

  .wiper-arm.is-wiping { animation: wipeAction 1.2s ease-in-out; }

  @keyframes wipeAction {
    0% { transform: rotate(-85deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(-85deg); }
  }

  #honkGraphic {
    position: absolute;
    top: 40%;
    left: 50%;
    font-size: clamp(50px, 8vw, 110px);
    font-weight: 900;
    font-style: italic;
    color: #fbcc04;
    text-transform: uppercase;
    text-shadow: 4px 4px 0 #cc0000, -4px -4px 0 #cc0000, 4px -4px 0 #cc0000, -4px 4px 0 #cc0000, 0 10px 20px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
    transform: translate(-50%, -50%) scale(0) rotate(-15deg);
    transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #honkGraphic.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-5deg);
  }

  /* 
    4. RESPONSIVE DASHBOARD CONSOLE 
  */
  .dashboard {
    height: 50vh;
    min-height: 420px;
    background: linear-gradient(to bottom, #2c3036 0%, #16181b 100%);
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 clamp(10px, 3vw, 40px);
    border-top: 6px solid #1a1c1f;
    box-shadow: inset 0 8px 15px rgba(255,255,255,0.05), 0 -15px 40px rgba(0,0,0,0.6);
    z-index: 100;
  }

  .dash-zone {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 30px);
    height: 100%;
  }

  .ac-vent {
    width: clamp(40px, 5vw, 80px);
    height: clamp(100px, 15vh, 180px);
    background: #0d0d0f;
    border: 4px solid #3a3d42;
    border-radius: 8px;
    box-shadow: inset 0 0 10px #000, 0 5px 10px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 12px 6px;
  }
  .vent-slat { width: 100%; height: 8px; background: #222; border-bottom: 2px solid #111; }

  /* Infotainment Screen */
  .infotainment {
    width: clamp(250px, 25vw, 340px);
    height: clamp(180px, 20vw, 240px);
    background: #050505;
    border-radius: 12px;
    border: 4px solid #1a1c1f;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 15px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .info-top {
    background: #111;
    padding: 8px 15px;
    display: flex;
    justify-content: space-between;
    color: #00bfff;
    font-family: monospace;
    font-size: clamp(10px, 1vw, 14px);
    border-bottom: 2px solid #222;
  }
  .info-top span { display: flex; flex-direction: column; align-items: center; }
  .info-top small { font-size: clamp(7px, 0.8vw, 9px); color: #888; margin-bottom: 2px; }
  .gear { color: #fff; font-weight: bold; }
  .gear.active { color: #00ff66; text-shadow: 0 0 5px #00ff66; }

  .info-screen {
    flex: 1;
    background: radial-gradient(circle, #1a1a2e, #0a0a1a);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 10px;
  }
  
  .radio-widget {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1vw, 15px);
  }
  .radio-icon {
    font-size: clamp(24px, 2.5vw, 36px);
    background: linear-gradient(135deg, #00bfff, #b026ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .radio-text { font-size: clamp(10px, 1vw, 12px); color: #aaa; line-height: 1.4; }
  .radio-text b { font-size: clamp(12px, 1.2vw, 16px); color: #fff; }
  .radio-text span { font-size: clamp(10px, 0.9vw, 12px); color: #888; }

  .info-bottom {
    display: flex;
    background: #111;
    border-top: 2px solid #222;
  }
  .info-bottom button {
    flex: 1; background: transparent; border: none; color: #888; padding: clamp(8px, 1vw, 12px);
    font-size: clamp(9px, 1vw, 12px); font-weight: bold; border-right: 1px solid #222; cursor: pointer;
  }
  .info-bottom button:last-child { border-right: none; }
  .info-bottom button:hover { color: #fff; background: #222; }

  /* 
    5. INSTRUMENT CLUSTER (Fluid Arced Layout)
  */
  .instrument-cluster {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vw, 25px); 
  }

  .gauge-container {
    position: relative;
    width: clamp(160px, 16vw, 250px); 
    height: clamp(160px, 16vw, 250px);
    background: radial-gradient(circle, #1a1a1a, #050505);
    border-radius: 50%;
    border: clamp(3px, 0.5vw, 6px) solid #22252a;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 15px 35px rgba(0,0,0,0.5), 0 0 0 2px #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Arc Layout using fluid translation */
  .gauge-container.gm { transform: translateY(15px); z-index: 1; }
  .gauge-container.cherry { transform: translateY(15px); z-index: 1; }
  .gauge-container.kddi { 
    width: clamp(180px, 18vw, 280px); 
    height: clamp(180px, 18vw, 280px); 
    transform: translateY(-15px); 
    z-index: 2; 
  }

  .gauge-label { position: absolute; top: 15%; font-size: clamp(12px, 1.5vw, 20px); font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 4px; }
  .gauge-container.kddi .gauge-label { top: 18%; }

  .gauge-value { position: absolute; bottom: 22%; font-size: clamp(20px, 2.5vw, 34px); font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(255,255,255,0.2); }
  .gauge-container.kddi .gauge-value { bottom: 25%; font-size: clamp(24px, 3vw, 38px); }

  .gauge-pct { position: absolute; bottom: 12%; font-size: clamp(9px, 1vw, 14px); font-weight: bold; letter-spacing: 1.5px; }
  .gauge-container.kddi .gauge-pct { bottom: 14%; }

  svg.gauge-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transform: rotate(135deg); }
  .gauge-ticks { fill: none; stroke: #444; stroke-width: 4; stroke-dasharray: 2 12; }
  .gauge-track { fill: none; stroke: #222; stroke-width: 4; }
  .gauge-fill { fill: none; stroke-width: 6; stroke-dasharray: 283; stroke-dashoffset: 283; stroke-linecap: round; filter: drop-shadow(0 0 6px currentColor); }

  .needle-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-135deg); }
  .needle { position: absolute; top: 50%; left: 50%; width: 2px; height: 46%; background: #fff; transform-origin: bottom center; transform: translate(-50%, -100%); box-shadow: 0 0 8px rgba(255,255,255,0.8); }
  .needle-center { position: absolute; top: 50%; left: 50%; width: clamp(20px, 2.5vw, 34px); height: clamp(20px, 2.5vw, 34px); background: radial-gradient(circle, #333, #0a0a0a); border: 2px solid #555; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 5px 10px rgba(0,0,0,0.6); }
  .needle-center::after { content: ''; position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: currentColor; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 5px currentColor; }

  /* 
    6. STEERING WHEEL, WIPER, AND IGNITION
  */
  .steering-column {
    position: absolute;
    bottom: -15vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* Wiper attached relatively to the steering column */
  .wiper-stalk {
    position: absolute;
    right: 100%; 
    margin-right: -10px;
    top: 40%; 
    width: clamp(80px, 10vw, 120px);
    height: clamp(24px, 3vh, 32px);
    background: linear-gradient(to bottom, #333, #111);
    border: 2px solid #000;
    border-radius: 16px 0 0 16px;
    color: #aaa;
    font-size: clamp(9px, 1vw, 11px);
    font-weight: bold;
    text-transform: uppercase;
    text-align: left;
    padding-left: 15px;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    transform-origin: right center;
    transition: transform 0.1s, color 0.2s;
    z-index: 9;
  }

  .wiper-stalk:hover { color: #fff; }
  .wiper-stalk:active { transform: rotate(-5deg); }

  /* IGNITION BUTTON */
  .ignition-btn {
    width: clamp(60px, 6vw, 80px);
    height: clamp(60px, 6vw, 80px);
    border-radius: 50%;
    background: radial-gradient(circle, #222, #0a0a0a);
    border: 4px solid #555;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 9;
  }

  .ignition-btn.off { box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,0,0,0.3); border-color: #aa2222; }
  .ignition-btn.on { box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,255,102,0.4); border-color: #00ff66; }
  .ignition-btn:active { transform: scale(0.92); }
  .ignition-btn span { font-size: clamp(8px, 0.8vw, 10px); font-weight: bold; color: #fff; text-align: center; line-height: 1.2; }
  .ignition-btn .status-light { width: 12px; height: 4px; background: #ff3333; border-radius: 2px; margin-top: 6px; box-shadow: 0 0 5px #ff3333; transition: background 0.3s, box-shadow 0.3s; }
  .ignition-btn.on .status-light { background: #00ff66; box-shadow: 0 0 8px #00ff66; }

  /* Horn / Wheel */
  .horn-wrapper {
    position: relative;
    width: clamp(300px, 35vw, 500px);
    height: clamp(150px, 17.5vw, 250px);
    background: #111;
    border-radius: 250px 250px 0 0;
    border: clamp(12px, 1.5vw, 24px) solid #050505;
    border-bottom: none;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: clamp(20px, 3vw, 40px);
    box-shadow: 0 -15px 50px rgba(0,0,0,0.6);
    z-index: 10;
  }

  .horn-btn {
    width: clamp(90px, 10vw, 150px);
    height: clamp(90px, 10vw, 150px);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #333, #111);
    border: 2px solid #000;
    color: #fff;
    cursor: pointer;
    box-shadow: inset 0 -5px 15px rgba(0,0,0,0.5), 0 15px 30px rgba(0,0,0,0.5);
    transition: all 0.1s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .horn-btn:active {
    transform: scale(0.96) translateY(5px);
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5);
  }

  .horn-btn span {
    font-weight: 900;
    font-size: clamp(14px, 1.8vw, 24px);
    letter-spacing: 4px;
    color: #ddd;
    text-shadow: 0 2px 4px #000;
  }

  /* 
    MOBILE / TABLET STACKING GRACEFUL DEGRADATION
  */
  @media (max-width: 950px) {
    .dashboard {
      flex-direction: column;
      height: auto;
      min-height: 60vh;
      padding-top: 30px;
      padding-bottom: 120px; /* Make room for bottom steering wheel */
      gap: 30px;
    }
    .dash-zone {
      order: 1;
      width: 100%;
      justify-content: center;
    }
    .ac-vent { display: none; } /* Hide vents to save space */
    .instrument-cluster {
      order: 2;
    }
    .steering-column {
      bottom: 0;
    }
    .wiper-stalk {
      top: -20px;
      right: 50%;
      margin-right: -40px;
      transform: rotate(-90deg);
      transform-origin: center;
    }
    .wiper-stalk:active { transform: rotate(-95deg); }
  }

</style>
</head>
<body>

  <!-- WINDSHIELD SCENE -->
  <div class="windshield">
    <div class="hud" id="hud-target">TARGET: 500,000</div>
    <div id="honkGraphic">HONK!!!</div>
    
    <div id="windshield-dirt">
      <div class="smudge" style="top: 15%; left: 20%; width: 220px; height: 140px; transform: rotate(15deg);"></div>
      <div class="smudge" style="top: 35%; left: 55%; width: 250px; height: 120px; transform: rotate(-10deg);"></div>
      <div class="smudge" style="top: 10%; left: 75%; width: 190px; height: 150px; transform: rotate(45deg);"></div>
      <div class="smudge" style="top: 50%; left: 10%; width: 180px; height: 100px; transform: rotate(-25deg);"></div>
      <div class="smudge" style="top: 40%; left: 80%; width: 200px; height: 110px; transform: rotate(5deg);"></div>
    </div>

    <div class="mountains"></div>

    <div class="world-camera">
      <div class="world-floor">
        <div class="track" id="master-track">
          <div class="road">
            <div class="road-lines"></div>
          </div>
          
          <div class="object-3d sign" id="sign-2024">
            <h4>2024</h4>
            <p>25,000</p>
          </div>
          
          <div class="object-3d sign" id="sign-2025">
            <h4>2025</h4>
            <p>210,000</p>
          </div>
          
          <div class="object-3d" id="party-500k">
            <div>🎊🎉🎈🚗💨</div>
            <div class="party-banner">500K CRUSHED - JULY 2026</div>
          </div>

          <div class="object-3d sign" id="sign-1m">
            <h4>TARGET</h4>
            <p style="color: #00ff66;">1,000,000</p>
          </div>
        </div>
      </div>
    </div>

    <div class="wiper-arm left" id="wiperLeft"></div>
    <div class="wiper-arm right" id="wiperRight"></div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="dashboard">
    
    <!-- LEFT ZONE -->
    <div class="dash-zone">
      <div class="ac-vent">
        <div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div>
      </div>
    </div>

    <!-- CENTER ZONE (INSTRUMENT CLUSTER) -->
    <div class="instrument-cluster">
      
      <!-- GM GAUGE -->
      <div class="gauge-container gm">
        <svg class="gauge-svg" viewBox="0 0 120 120">
          <circle class="gauge-outer-ticks" cx="60" cy="60" r="56" stroke-dasharray="212 351" stroke-dashoffset="0"></circle>
          <circle class="gauge-track" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="0"></circle>
          <circle class="gauge-fill" id="fill-gm" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="216"></circle>
        </svg>
        <div class="gauge-center-content">
          <div class="gauge-label">GM</div>
          <div class="gauge-value" id="val-gm">0</div>
          <div class="gauge-subtext" id="pct-gm" style="color: #00d2ff;">0.00%</div>
        </div>
      </div>

      <!-- KDDI GAUGE -->
      <div class="gauge-container kddi">
        <svg class="gauge-svg" viewBox="0 0 120 120">
          <circle class="gauge-outer-ticks" cx="60" cy="60" r="56" stroke-dasharray="212 351" stroke-dashoffset="0"></circle>
          <circle class="gauge-track" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="0"></circle>
          <circle class="gauge-fill" id="fill-kddi" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="216"></circle>
        </svg>
        <div class="gauge-center-content">
          <div class="gauge-label">KDDI</div>
          <div class="gauge-value" id="val-kddi">0</div>
          <div class="gauge-subtext" id="pct-kddi" style="color: #39ff14;">0.00%</div>
        </div>
      </div>

      <!-- CHERRY GAUGE -->
      <div class="gauge-container cherry">
        <svg class="gauge-svg" viewBox="0 0 120 120">
          <circle class="gauge-outer-ticks" cx="60" cy="60" r="56" stroke-dasharray="212 351" stroke-dashoffset="0"></circle>
          <circle class="gauge-track" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="0"></circle>
          <circle class="gauge-fill" id="fill-cherry" cx="60" cy="60" r="46" stroke-dasharray="216 289" stroke-dashoffset="216"></circle>
        </svg>
        <div class="gauge-center-content">
          <div class="gauge-label">CHERRY</div>
          <div class="gauge-value" id="val-cherry">0</div>
          <div class="gauge-subtext" id="pct-cherry" style="color: #b026ff;">Loading</div>
        </div>
      </div>

      <!-- STEERING COLUMN -->
      <div class="steering-column">
        <button class="wiper-stalk" onclick="triggerWipe()">Wipe</button>
        <div class="horn-wrapper">
          <button class="horn-btn" onclick="honkHorn()">
            <span>HORN</span>
          </button>
        </div>
      </div>

    </div>

    <!-- RIGHT ZONE (CENTER CONSOLE) -->
    <div class="dash-zone">
      
      <!-- INFOTAINMENT SCREEN -->
      <div class="infotainment">
        <div class="info-top">
          <span><small>TEMP</small>22°C</span>
          <span><small>GEAR</small><span class="gear" id="gear-indicator">P</span></span>
          <span><small>DATE</small>AUG 11 2026</span>
        </div>
        <div class="info-screen">
          <div class="radio-widget">
            <div class="radio-icon">🎵</div>
            <div class="radio-text">Now Playing<br><b>I Want It That Way</b><br><span>Backstreet Boys</span></div>
          </div>
        </div>
        <div class="info-bottom">
          <button>NAV</button><button>MEDIA</button><button>CLIMATE</button>
        </div>
      </div>

      <div class="ignition-btn off" id="ignitionBtn" onclick="toggleIgnition()">
        <span>ENGINE<br>START<br>STOP</span>
        <div class="status-light"></div>
      </div>

      <div class="ac-vent">
        <div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div>
      </div>

    </div>

  </div>

  <script>
    const TARGET_1M = 1000000;
    const ARC_LENGTH = 216; 

    let reqFrames = {};
    let currentVals = { gm: 0, kddi: 0, total: 0 };
    let driveSequenceActive = false;
    let trackY = 0; 
    let engineRunning = false;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function animateValue(id, start, end, duration) {
      if (reqFrames[id]) cancelAnimationFrame(reqFrames[id]);
      const obj = document.getElementById(`val-${id}`);
      let startTimestamp = null;
      
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeOut = 0.5 - Math.cos(progress * Math.PI) / 2; 
        const current = Math.floor(easeOut * (end - start) + start);
        
        obj.innerHTML = current.toLocaleString();
        
        if (progress < 1) {
          reqFrames[id] = window.requestAnimationFrame(step);
        }
      };
      reqFrames[id] = window.requestAnimationFrame(step);
    }

    function updateGauges(gmVal, kddiVal, durationMs) {
      const targets = [
        { id: 'gm', val: gmVal },
        { id: 'kddi', val: kddiVal }
      ];
      
      targets.forEach(item => {
        const pct = (item.val / TARGET_1M) * 100; 
        const fill = document.getElementById(`fill-${item.id}`);
        const pctEl = document.getElementById(`pct-${item.id}`);

        fill.style.transition = `stroke-dashoffset ${durationMs}ms ease-in-out`;
        
        const displayPct = Math.max(pct, 0.5); 
        const fillAmount = (displayPct / 100) * ARC_LENGTH; 
        fill.style.strokeDashoffset = ARC_LENGTH - fillAmount;

        pctEl.innerHTML = pct.toFixed(2) + "% of 1M";

        if (durationMs > 0) {
            animateValue(item.id, currentVals[item.id], item.val, durationMs);
        } else {
            document.getElementById(`val-${item.id}`).innerHTML = item.val.toLocaleString();
        }
        currentVals[item.id] = item.val;
      });
    }

    async function driveTo(distanceY, duration) {
      if (!driveSequenceActive) return;
      const track = document.getElementById('master-track');
      
      const anim = track.animate([
        { transform: `translateY(${trackY}px)` },
        { transform: `translateY(${distanceY}px)` }
      ], { 
        duration: duration, 
        easing: 'ease-in-out', 
        fill: 'forwards' 
      });

      trackY = distanceY;
      await anim.finished; 
    }

    function toggleIgnition() {
      const btn = document.getElementById('ignitionBtn');
      const gear = document.getElementById('gear-indicator');
      
      if (!engineRunning) {
        engineRunning = true;
        btn.classList.replace('off', 'on');
        gear.innerHTML = 'D';
        gear.classList.add('active');
        startDriveSequence();
      } else {
        engineRunning = false;
        driveSequenceActive = false;
        btn.classList.replace('on', 'off');
        gear.innerHTML = 'P';
        gear.classList.remove('active');
        
        document.getElementById('master-track').style.transform = `translateY(0)`;
        updateGauges(0, 0, 500);
        const hud = document.getElementById('hud-target');
        hud.className = 'hud';
        hud.innerHTML = 'TARGET: 500,000';
        
        document.getElementById('windshield-dirt').style.opacity = '1';
      }
    }

    async function startDriveSequence() {
      driveSequenceActive = false; 
      await sleep(50);
      driveSequenceActive = true;
      trackY = 0;

      const hud = document.getElementById('hud-target');
      hud.className = 'hud';
      hud.innerHTML = 'TARGET: 500,000';

      document.getElementById('master-track').style.transform = `translateY(0)`;
      updateGauges(0, 0, 0);
      
      await sleep(1000);
      if (!driveSequenceActive) return;

      // LEG 1: 2024
      await driveTo(1200, 3000); 
      if (!driveSequenceActive) return;
      updateGauges(25000, 0, 2000);
      await sleep(2500); 

      // LEG 2: 2025
      await driveTo(3700, 3500); 
      if (!driveSequenceActive) return;
      updateGauges(198000, 12000, 2000);
      await sleep(2500);

      // LEG 3: 500k Party
      await driveTo(6200, 3500); 
      if (!driveSequenceActive) return;
      updateGauges(523028, 41055, 2000);
      
      fireConfetti();
      await sleep(800);
      fireConfetti();
      
      hud.classList.add('upgraded');
      hud.innerHTML = 'TARGET UPGRADED: 1,000,000!';
      await sleep(3500); 

      // LEG 4: Toward 1 Million
      await driveTo(9000, 4000); 
    }

    function fireConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.4 },
        colors: ['#4ba3e3', '#00ff66', '#fbcc04', '#cc0000', '#ffffff']
      });
    }

    function triggerWipe() {
      const leftWiper = document.getElementById('wiperLeft');
      const rightWiper = document.getElementById('wiperRight');
      
      leftWiper.classList.remove('is-wiping');
      rightWiper.classList.remove('is-wiping');
      void leftWiper.offsetWidth; 
      
      leftWiper.classList.add('is-wiping');
      rightWiper.classList.add('is-wiping');
      
      setTimeout(() => {
        document.getElementById('windshield-dirt').style.opacity = '0';
      }, 600);
    }

    function honkHorn() {
      const honk = document.getElementById('honkGraphic');
      honk.classList.add('show');
      
      const windshield = document.querySelector('.windshield');
      windshield.style.filter = 'brightness(1.15)';
      
      setTimeout(() => {
        honk.classList.remove('show');
        windshield.style.filter = 'none';
      }, 350);
    }

    window.onload = () => {
      updateGauges(0, 0, 0);
    };
  </script>
</body>
</html>
