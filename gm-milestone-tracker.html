<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Base Milestone Race - Dashboard Edition</title>
<style>
  /* 
    BRAND TOKENS (Preserved for cohesion)
  */
  :root {
    --purple: #48286D;
    --purple-d: #38205A;
    --green: #66CC00;
    --green-d: #488500;
    --ink: #2A1A3E;
    --dash-surface: #151515;
    --dash-trim: #222;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; /* Lock to a single viewport like a real dashboard */
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 
    1. THE WINDSHIELD (3D Road Animation)
  */
  .windshield {
    flex: 1;
    position: relative;
    perspective: 800px;
    background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 100%);
    overflow: hidden;
    border-bottom: 12px solid var(--ink);
    box-shadow: inset 0 -20px 50px rgba(0,0,0,0.8);
  }

  /* Sky / Horizon Glow */
  .windshield::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 150px;
    background: linear-gradient(to top, rgba(102, 204, 0, 0.2), transparent);
    pointer-events: none;
  }

  .road {
    position: absolute;
    bottom: -100px;
    left: -50%;
    width: 200%;
    height: 300px;
    background-color: #111;
    transform: rotateX(75deg);
    transform-origin: bottom center;
    border-left: 5px solid var(--purple);
    border-right: 5px solid var(--purple);
  }

  /* Animated Road Lines */
  .road::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 8px;
    height: 200%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
      to bottom,
      var(--purple) 0,
      var(--purple) 40px,
      transparent 40px,
      transparent 80px
    );
    animation: drive 0.8s linear infinite;
  }

  @keyframes drive {
    from { transform: translateX(-50%) translateY(0); }
    to { transform: translateX(-50%) translateY(80px); }
  }

  /* Floating Mission Text */
  .hud-text {
    position: absolute;
    top: 20px;
    left: 20px;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 12px;
    text-shadow: 0 0 10px var(--green);
    font-weight: bold;
  }

  /* 
    2. THE DASHBOARD CONSOLE
  */
  .dashboard {
    height: 45vh;
    background: linear-gradient(to bottom, var(--dash-trim) 0%, var(--dash-surface) 100%);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4vw;
    padding: 20px;
    border-top: 2px solid #444;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
  }

  /* Dashboard Texture */
  .dashboard::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMTUxNTE1Ij48L3JlY3Q+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiMxMTEiPjwvcmVjdD4KPC9zdmc+') repeat;
    opacity: 0.5;
    pointer-events: none;
  }

  /* 
    3. THE GAUGES 
  */
  .gauge-container {
    position: relative;
    width: 220px;
    height: 220px;
    background: #0a0a0a;
    border-radius: 50%;
    border: 8px solid var(--ink);
    box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* Highlight on the glass */
  .gauge-container::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 10%;
    width: 80%;
    height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
    border-radius: 50% 50% 0 0;
    pointer-events: none;
  }

  .gauge-label {
    position: absolute;
    top: 35px;
    font-size: 14px;
    font-weight: bold;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .gauge-value {
    position: absolute;
    bottom: 45px;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }

  .gauge-pct {
    position: absolute;
    bottom: 25px;
    font-size: 10px;
    color: var(--green);
    letter-spacing: 1px;
  }

  svg.gauge-svg {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transform: rotate(135deg); /* Start point of the arc */
  }

  .gauge-track {
    fill: none;
    stroke: #222;
    stroke-width: 8;
  }

  .gauge-fill {
    fill: none;
    stroke: var(--green);
    stroke-width: 8;
    stroke-dasharray: 283; /* 2 * pi * r (r=45) */
    stroke-dashoffset: 283;
    transition: stroke-dashoffset 2s cubic-bezier(.2, 0, 0, 1);
    stroke-linecap: round;
  }

  .needle-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-135deg); /* Zero position */
    transition: transform 2s cubic-bezier(.2, 0, 0, 1);
  }

  .needle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 45%;
    background: #ff3333;
    transform-origin: bottom center;
    transform: translate(-50%, -100%);
    border-radius: 4px 4px 0 0;
    box-shadow: 0 0 5px rgba(255, 51, 51, 0.6);
  }

  .needle-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 24px;
    background: #111;
    border: 3px solid #333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* 
    4. THE STEERING WHEEL HORN
  */
  .horn-wrapper {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 200px;
    background: #111;
    border-radius: 200px 200px 0 0;
    border: 15px solid #050505;
    border-bottom: none;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 30px;
    z-index: 10;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
  }

  .horn-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--purple-d), #1a0f2e);
    border: 4px solid var(--purple);
    color: #fff;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: inset 0 -5px 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5);
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .horn-btn:active {
    transform: scale(0.92) translateY(5px);
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.5);
  }

  .horn-btn svg {
    width: 40px;
    height: 40px;
    fill: var(--green);
  }

</style>
</head>
<body>

  <!-- WINDSHIELD SCENE -->
  <div class="windshield">
    <div class="hud-text">
      TARGET: 500,000 UNITS<br>
      STATUS: IN TRANSIT
    </div>
    <div class="road"></div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="dashboard">
    
    <!-- GM GAUGE -->
    <div class="gauge-container">
      <div class="gauge-label">GM</div>
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-track" cx="50" cy="50" r="45" stroke-dasharray="212" stroke-dashoffset="0"></circle>
        <!-- 212 is approx 75% of the circle (283 circumference) to leave a gap at bottom -->
        <circle class="gauge-fill" id="fill-gm" cx="50" cy="50" r="45"></circle>
      </svg>
      <div class="needle-container" id="needle-gm">
        <div class="needle"></div>
      </div>
      <div class="needle-center"></div>
      <div class="gauge-value" id="val-gm">0</div>
      <div class="gauge-pct">87.59%</div>
    </div>

    <!-- KDDI GAUGE -->
    <div class="gauge-container">
      <div class="gauge-label">KDDI</div>
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-track" cx="50" cy="50" r="45" stroke-dasharray="212" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-kddi" cx="50" cy="50" r="45" style="stroke: #2288ee;"></circle>
      </svg>
      <div class="needle-container" id="needle-kddi">
        <div class="needle"></div>
      </div>
      <div class="needle-center"></div>
      <div class="gauge-value" id="val-kddi">0</div>
      <div class="gauge-pct" style="color: #2288ee;">8.07%</div>
    </div>

    <!-- CHERRY GAUGE -->
    <div class="gauge-container">
      <div class="gauge-label">CHERRY</div>
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-track" cx="50" cy="50" r="45" stroke-dasharray="212" stroke-dashoffset="0"></circle>
        <circle class="gauge-fill" id="fill-cherry" cx="50" cy="50" r="45" style="stroke: #ee2222;"></circle>
      </svg>
      <div class="needle-container" id="needle-cherry">
        <div class="needle"></div>
      </div>
      <div class="needle-center"></div>
      <div class="gauge-value" id="val-cherry">0</div>
      <div class="gauge-pct" style="color: #ee2222;">0.00%</div>
    </div>

    <!-- STEERING WHEEL HORN -->
    <div class="horn-wrapper">
      <button class="horn-btn" onclick="honkHorn()">
        <!-- SVG Horn Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12.89,3L14.85,3.4L11.11,21L9.15,20.6L12.89,3M19.59,12L16,8.41V5.58L22.42,12L16,18.41V15.58L19.59,12M1.58,12L8,5.58V8.41L4.41,12L8,15.58V18.41L1.58,12Z" />
        </svg>
      </button>
    </div>

  </div>

  <script>
    // --- GAUGE ANIMATION LOGIC ---
    // Circumference of our gauge (r=45) is ~282.7. 
    // We only use 75% of the circle for the gauge arc, which is ~212.
    const MAX_DASH = 212; 
    const DASH_OFFSET_START = 283; 
    
    // Degrees rotation for needle (Starts at -135deg, sweeps 270deg max)
    const MAX_DEG = 270;

    const data = [
      { id: 'gm', targetVal: 437958, pct: 87.59 },
      { id: 'kddi', targetVal: 40339, pct: 8.07 },
      { id: 'cherry', targetVal: 0, pct: 0.1 } // Give cherry a tiny bump so it's not dead zero visually
    ];

    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(easeOut * (end - start) + start);
        obj.innerHTML = current.toLocaleString();
        if (progress < 1) window.requestAnimationFrame(step);
      };
      window.requestAnimationFrame(step);
    }

    // Trigger animations on load
    window.onload = () => {
      setTimeout(() => {
        data.forEach(item => {
          // 1. Animate SVGs
          const fill = document.getElementById(`fill-${item.id}`);
          const needle = document.getElementById(`needle-${item.id}`);
          const valEl = document.getElementById(`val-${item.id}`);

          // Calculate offset based on percentage
          // To fill it, we reduce the offset. 
          const fillAmount = (item.pct / 100) * MAX_DASH; 
          fill.style.strokeDashoffset = DASH_OFFSET_START - fillAmount;

          // Calculate needle rotation
          const rotDegree = -135 + ((item.pct / 100) * MAX_DEG);
          needle.style.transform = `rotate(${rotDegree}deg)`;

          // 2. Animate Numbers
          animateValue(valEl, 0, item.targetVal, 2000);
        });
      }, 300); // slight delay for effect
    };

    // --- WEB AUDIO API HORN LOGIC ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function honkHorn() {
      // Initialize context on first click to bypass browser autoplay policies
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }

      // Create oscillator (the sound source)
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      // Configure sound type to sound vaguely like a digital car horn
      osc.type = 'sawtooth'; 
      osc.frequency.setValueAtTime(350, audioCtx.currentTime); // 350Hz 
      
      // Envelope to make it punchy
      gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      // Play sound
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);

      // Add a visual flash to the windshield
      const windshield = document.querySelector('.windshield');
      windshield.style.background = 'linear-gradient(to bottom, #2a0a0a 0%, #3a1a1a 100%)';
      setTimeout(() => {
        windshield.style.background = 'linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 100%)';
      }, 150);
    }
  </script>
</body>
</html>
